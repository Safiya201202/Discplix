<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>DISCPLIX</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{position:relative;background:linear-gradient(155deg,color-mix(in srgb,var(--card) 90%,transparent),color-mix(in srgb,var(--bg) 30%,var(--card)));border:1px solid var(--ln);border-radius:24px;padding:20px;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,var(--sh);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.end{justify-content:flex-end}.between{justify-content:space-between}
button,input,select,textarea{font:inherit;color:inherit}

.tag{font-size:12px;border-radius:8px;padding:1px 9px;background:var(--slate)}.tag.Urgent,.tag.Overdue{background:var(--red);color:#fff}.tag.High{background:var(--wine);color:var(--peach)}.tag.Completed{background:var(--peach);color:#161E2F}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0}.li .g{flex:1;min-width:0}.li b{display:block;overflow-wrap:anywhere}.li small{color:var(--mu)}
.done b{text-decoration:line-through;color:var(--mu)}input[type=checkbox]{width:22px;height:22px;accent-color:var(--red);flex:none;margin:0;padding:0}
.bar{height:10px;background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--peach));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.ch{width:100%;height:auto}.empty{padding:24px 8px;text-align:center;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(10,14,24,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50}.md{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:24px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:var(--sh);animation:pop .22s cubic-bezier(.2,.8,.2,1)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}.ring{display:block;margin:0 auto;filter:drop-shadow(0 0 14px rgba(181,26,40,.35))}

.run .ring{animation:pulse 2.6s ease-in-out infinite}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal button{min-height:60px;text-align:left;padding:6px 8px;background:color-mix(in srgb,var(--bg) 60%,transparent);display:flex;flex-direction:column;gap:2px;font-size:13px;border-radius:14px}.cal button.on{border-color:var(--red);background:var(--wine)}.cal button.t{border-color:var(--peach)}.cal small{color:var(--peach)}.cal .h{text-align:center;color:var(--mu);font-size:12px}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:5px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--ln)}.dots i.y{background:linear-gradient(135deg,var(--peach),var(--red));border-color:transparent}
.dt{width:50px;text-align:center;background:color-mix(in srgb,var(--bg) 70%,transparent);border-radius:14px;padding:5px 0;flex:none;line-height:1.1}.dt b{display:block;font-size:18px}.dt small{color:var(--peach)}
.rk{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--slate);font-weight:700;font-size:13px;flex:none}.rk.r0{background:var(--peach);color:#2A0F14}.rk.r1{background:var(--red);color:#fff}.rk.r2{background:var(--wine);color:#fff}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;background:var(--slate)}
.cl{height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0;padding-right:4px}
.msg{max-width:84%;background:var(--slate);border-radius:18px 18px 18px 4px;padding:8px 13px;align-self:flex-start;animation:pop .25s}.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--red),#8c1420);color:#fff;border-radius:18px 18px 4px 18px}.msg small{opacity:.75;font-size:12px}.msg p{overflow-wrap:anywhere}.msg a{color:inherit}
.hero{min-height:250px}.hero .pl{display:inline-block;background:rgba(0,0,0,.28);border-radius:20px;padding:3px 12px;font-size:13px}.hero .hr{position:absolute;right:30px;top:50%;transform:translateY(-50%);display:grid;place-items:center;z-index:1}.hr span{position:absolute;text-align:center;line-height:1.15;font-size:13px}.hr b{display:block;font-size:26px}.hero button.bk{background:rgba(0,0,0,.4);color:#fff;border:0;border-radius:30px;padding:10px 20px;margin-top:14px;position:relative;z-index:1}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.hm i,.hl i{display:block;aspect-ratio:1;border-radius:8px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--ln)}.hl{margin-top:10px;gap:5px}.hl i{width:14px;aspect-ratio:auto;height:14px;border-radius:4px}i.l1{background:color-mix(in srgb,var(--red) 40%,var(--card))!important}i.l2{background:var(--red)!important}i.l3{background:color-mix(in srgb,var(--peach) 60%,var(--red))!important}i.l4{background:var(--peach)!important}.hh{text-align:center;color:var(--mu);font-size:12px}
.pd{width:9px;height:9px;border-radius:50%;background:var(--peach);flex:none}.seg{display:flex;gap:3px;height:28px;margin:12px 0 8px}.seg i{flex:1;border-radius:2px;background:var(--ln)}.seg i.y{background:linear-gradient(var(--peach),var(--red))}.tile .big{margin:10px 0 12px}.tile svg{color:var(--peach)}
.tlx{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;margin-top:10px}.tc{min-width:170px;flex:none;border:1px solid var(--ln);border-radius:18px;padding:12px;background:color-mix(in srgb,var(--bg) 55%,transparent)}.tc.pa{opacity:.45}.tc.nx{border-color:var(--peach);background:var(--wine);color:#fff}.tc .tp{display:inline-block;font-size:12px;border-radius:12px;padding:1px 10px;background:var(--slate);margin-bottom:6px;color:var(--tx)}.tc.nx .tp{background:var(--peach);color:#2A0F14}.tc b{display:block}.ins{padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--bg) 55%,transparent);margin-top:10px}.ins b{display:block}
@media (max-width:560px){.hero .hr{display:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}
@keyframes drift{to{transform:translate3d(2%,3%,0) scale(1.06)}}
@keyframes glow{to{transform:translate(-14%,18%) scale(1.15)}}
@keyframes pulse{50%{filter:drop-shadow(0 0 26px rgba(255,165,134,.55))}}
@keyframes sweep{from{stroke-dashoffset:var(--c)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleY(0)}}
.in .grid>.card{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
.in .grid>.card:nth-child(2){animation-delay:.06s}.in .grid>.card:nth-child(3){animation-delay:.12s}.in .grid>.card:nth-child(4){animation-delay:.18s}.in .grid>.card:nth-child(5){animation-delay:.24s}.in .grid>.card:nth-child(n+6){animation-delay:.3s}
.in .pr{animation:sweep 1.3s cubic-bezier(.2,.8,.2,1) both}.in .spark polyline{stroke-dasharray:1;animation:draw 1.8s ease-out .2s both}
.in .ch rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}.in .ch rect:nth-of-type(even){animation-delay:.08s}
@media (max-width:1100px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;z-index:40;top:auto;bottom:0;left:0;right:0;height:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}.logo{display:none}aside nav{flex-direction:row;max-width:100%;overflow-x:auto;border-radius:22px}.n::after{display:none}main{padding-bottom:104px}}
@media (max-width:560px){.c3{grid-column:span 12}.n{width:40px;height:44px}.cal button{min-height:46px;padding:3px 4px}.tm{font-size:44px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><div id="toasts" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),mem={};
const st={get(k){try{const x=localStorage.getItem(k);return x?JSON.parse(x):null}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),rid=()=>crypto.randomUUID();
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256))}
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},today=()=>dk(Date.now());
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return dk(x)},mon=d=>addD(d,-((new Date(d+'T12:00').getDay()+6)%7));
const PR=['Low','Medium','High','Urgent'],PO={Urgent:0,High:1,Medium:2,Low:3},CAT=['Personal','Education','Career','Fitness','Financial','Other'];
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),fh=m=>m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m';
const DEF=()=>({tasks:[],habits:[],hc:[],sessions:[],goals:[],events:[],set:{theme:'dark',tz:Intl.DateTimeFormat().resolvedOptions().timeZone,sound:true},timer:null});
let U=null,D=null,V='dashboard',T={q:'',f:'all',s:'due',n:20},CH='week',CAL={v:'month',sel:today()},AD='overview',UQ={q:'',s:'all'},FM={type:'focus',min:25},lt=0;
const loadD=u=>Object.assign(DEF(),st.get('dx:d:'+u.id)||{});
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2800)}
const fld=(k,l,t='text',v='',o)=>`<label>${l}${t==='select'?`<select name="${k}">${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${k}" rows="3">${esc(v)}</textarea>`:`<input name="${k}" type="${t}" value="${esc(v)}"${t==='number'?' step="any"':''}>`}</label>`;
function modal(title,body,ok,fn,cls){const m=document.createElement('div');m.className='ov';m.innerHTML=`<form class="md" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2 style="margin-bottom:14px">${esc(title)}</h2>${body}<p class="er" role="alert"></p><div class="row end"><button type="button" class="g" data-x>Cancel</button><button class="b ${cls||''}">${esc(ok)}</button></div></form>`;document.body.appendChild(m);const f=m.firstChild;f.querySelector('input,select,textarea')?.focus();m.onclick=e=>{if(e.target===m||e.target.hasAttribute('data-x'))m.remove()};f.onsubmit=async e=>{e.preventDefault();const bt=f.querySelector('.b');bt.disabled=true;const er=await fn(Object.fromEntries(new FormData(f)));if(er){f.querySelector('.er').textContent=er;bt.disabled=false}else m.remove()}}
const confirmD=(msg,ok,fn)=>modal('Confirm',`<p>${msg}</p>`,ok,()=>{fn()},'danger');

/* ---------- derived data ---------- */
const stat=t=>t.doneAt?'Completed':(t.due&&new Date(t.due)<new Date()?'Overdue':t.status);
const wk=o=>{const s=addD(mon(today()),o*7);return[s,addD(s,7)]};
const doneIn=(a,b,d=D)=>d.tasks.filter(t=>t.doneAt&&dk(t.doneAt)>=a&&dk(t.doneAt)<b).length;
const fSess=(d=D)=>d.sessions.filter(s=>s.type==='focus'&&s.status==='completed');
const fmin=(a,b,d=D)=>Math.round(fSess(d).filter(s=>dk(s.start)>=a&&dk(s.start)<b).reduce((x,s)=>x+s.sec,0)/60);
const delta=(c,p)=>p>0?((c>=p?'+':'')+Math.round((c-p)/p*100)+'% vs last week'):'No prior week to compare';
const doneH=(h,d)=>D.hc.some(c=>c.h===h.id&&c.d===d),cntH=(h,a,b)=>D.hc.filter(c=>c.h===h.id&&c.d>=a&&c.d<b).length;
function streak(h){if(h.freq==='daily'){let d=today();if(!doneH(h,d))d=addD(d,-1);let n=0;while(doneH(h,d)&&n<3650){n++;d=addD(d,-1)}return n}
let w=mon(today());if(cntH(h,w,addD(w,7))<h.target)w=addD(w,-7);let n=0;while(cntH(h,w,addD(w,7))>=h.target&&n<520){n++;w=addD(w,-7)}return n}
const rate=h=>Math.min(100,Math.round(cntH(h,addD(today(),-6),addD(today(),1))/(h.freq==='daily'?7:h.target)*100));
const goalSt=g=>g.archived?'Archived':g.cur>=g.target?'Completed':(g.date&&g.date<today()?'Overdue':'Active');
const prod=()=>{const[a,b]=wk(0),due=D.tasks.filter(t=>t.due&&dk(t.due)>=a&&dk(t.due)<b);return due.length?Math.round(due.filter(t=>t.doneAt).length/due.length*100):null};
const greet=()=>{const h=+new Date().toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:D.set.tz})%24;return h<5?'Good night':h<12?'Good morning':h<18?'Good afternoon':'Good evening'};

/* ---------- views ---------- */
